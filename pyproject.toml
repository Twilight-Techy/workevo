[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "workevo"
version = "0.1.0"
description = "Bounded workflow and skill optimization with auditable validation gates"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.urls]
Homepage = "https://github.com/Twilight-Techy/workevo"
Repository = "https://github.com/Twilight-Techy/workevo"
Issues = "https://github.com/Twilight-Techy/workevo/issues"

[project.scripts]
workevo = "workevo.cli:main"

[dependency-groups]
browser = [
    "playwright>=1.50,<2",
]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/workevo"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "docs", "reports", "README.md", "AGENTS.md", "pyproject.toml", "uv.lock", "Makefile", "LICENSE", ".github"]
exclude = ["context", ".venv", "dist", "runs", "artifacts", ".workevo", "reports/release-check.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
