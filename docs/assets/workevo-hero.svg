    <text x="162" y="74" fill="#b8e9c6" font-size="13" text-anchor="middle" letter-spacing="2">WORKFLOW EVOLUTION</text>
    <text x="58" y="218" fill="#eff8f1" font-size="116" font-weight="700" letter-spacing="-7">workevo<tspan fill="#a5e8bb">.</tspan></text>
    <text x="64" y="276" fill="#c0d3c7" font-size="29" letter-spacing="-.4">Better workflows. Fixed model weights.</text>
    <text x="65" y="352" fill="#93b8a3" font-size="17" letter-spacing="1.2">EXECUTE <tspan fill="#628c76"> / </tspan> EVALUATE <tspan fill="#628c76"> / </tspan> EVOLVE <tspan fill="#628c76"> / </tspan> REUSE</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
