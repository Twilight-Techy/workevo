<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">workevo — better workflows, fixed model weights</title>
  <desc id="description">A dark forest-green banner with a branching workflow. One bright path leads to a retained skill; other trial paths remain visible.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102520"/><stop offset="1" stop-color="#091513"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#87dcb1" stop-opacity=".18"/><stop offset="1" stop-color="#87dcb1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#98c9b1" opacity=".13"/></pattern>
    <linearGradient id="path" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#3b8065"/><stop offset="1" stop-color="#b9f3c8"/></linearGradient>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#background)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <ellipse cx="1045" cy="175" rx="320" ry="270" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="418" rx="23" fill="none" stroke="#355849"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
