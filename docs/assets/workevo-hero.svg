    <circle cx="861" cy="246" r="8" fill="#152e23" stroke="#8cc9a3"/>
    <rect x="910" y="171" width="40" height="40" rx="12" fill="#294d39" stroke="#9bdbb0"/>
    <rect x="1018" y="86" width="40" height="40" rx="12" fill="#a5e8bb" stroke="#d5f9e0"/>
