name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: make check
      - run: uv build
  inspector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked --group browser
      - run: uv run --group browser playwright install --with-deps chromium
      - run: uv run workevo demo --directory .workevo/demo
      - run: uv run --group browser python scripts/check_inspector.py .workevo/demo/inspector.html
